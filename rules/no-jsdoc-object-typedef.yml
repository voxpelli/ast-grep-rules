id: no-jsdoc-object-typedef
language: javascript
# Diagnostic is authored as an agent-executable instruction, split across
# ast-grep's three fields: `message` = one line WHAT; `note` = the HOW
# (multi-line markdown); `metadata` = machine-readable routing so a scout→apply
# harness picks a strategy without parsing prose.
# NOTE: `$NAME` interpolation and `fix:` were lost when ast-grep 0.45.0 broke
# `pattern: $C` binding for comment nodes. Revert to the `transform`-based
# version if/when ast-grep restores comment metavariable binding.
message: >-
  Redundant `{object}` on `@typedef {object}` — the `@property` tags below
  already define the shape. See note for the manual fix.
note: |
  Delete `{object} ` so the tag reads `@typedef NAME`. The `@property` tags
  below already carry the shape, so removing `{object}` is behaviour-neutral
  — a pure syntactic simplification, never a type change.
  NOTE: This rule was previously auto-fixable but the `fix` was lost when
  ast-grep 0.45.0 broke `pattern: $C` binding for comment nodes. The fix is
  still a simple manual edit: remove `{object} ` from the `@typedef` line.
metadata:
  autofixable: false      # was true; pattern metavariable binding broken in 0.45.0
  edits: 1
  applyMode: manual       # was bulk; now requires manual edit until upstream fix
  cheapModelSafe: true
  gate: tsc --noEmit
severity: warning
rule:
  kind: comment
  regex: '@typedef\s+\{object\}'
