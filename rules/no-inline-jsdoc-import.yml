id: no-inline-jsdoc-import
language: javascript
# Diagnostic split across ast-grep's fields (see no-jsdoc-object-typedef for the
# convention): `message` = one line WHAT; `note` = the ordered HOW (no var
# interpolation); `metadata` = machine-readable routing.
# NOTE: `$MOD`/`$TYP` interpolation was lost when ast-grep 0.45.0 broke `pattern:
# $C` binding for comment nodes. Revert to the `transform`-based version if/when
# ast-grep restores comment metavariable binding.
message: >-
  Inline `import()` in a JSDoc type — hoist it to a top-level `@import`.
  Detection-only (see note): the two-edit hoist can't be a single-node autofix.
note: |
  Two ordered edits — do BOTH, or tsc breaks:
  1. Add a top-level `/** @import { NAME } from 'MODULE' */` after the file's
     `import`/`require` statements. If an `@import` from that MODULE ALREADY
     exists, ADD the name to its brace list — do NOT add a second `@import` line
     for the same module (that is a TS2300 duplicate-identifier error).
  2. Replace the inline `import('MODULE').NAME` at this site with the bare `NAME`.

  A tsc error after edit 2 alone is EXPECTED — it means edit 1 is still missing,
  not that the change is wrong. Applying only edit 2 leaves `NAME` undefined.
metadata:
  autofixable: false       # forced: ast-grep's fix is single-node; edit 1 is elsewhere
  edits: 2
  applyMode: agent         # deterministic, but two edits in two locations
  cheapModelSafe: true     # ~99% in-pilot with the dedup rule above; the gate catches the rest
  gate: tsc --noEmit
severity: warning
# NOT auto-fixable (deliberately no `fix`): a correct fix must BOTH rewrite the
# inline ref → bare `NAME` AND add a top-level `/** @import { NAME } from
# 'MODULE' */` elsewhere in the file. ast-grep's fix is node-local (the matched
# comment only) and can't insert that second edit, so rewriting alone would
# leave `NAME` undefined. Hoist by hand.
# NOTE: The `transform` for `$MOD`/`$TYP` was removed because ast-grep 0.45.0
# broke `pattern: $C` binding for comment nodes. The message is now static.
rule:
  all:
    - kind: comment
    # JSDoc block comments only: `^/\*\*` excludes `//` line comments and plain
    # `/* … */` blocks that merely mention import() in prose. `(?s)` lets `.` span
    # the newlines of a multi-line JSDoc block.
    - regex: '(?s)^/\*\*.*import\(\s*[''"][^''"]+[''"]\s*\)\s*\.'
    # EXCLUDE `@typedef {import('mod').X} X` — a JSDoc type ALIAS, which doubles
    # as a cross-module type RE-EXPORT (consumable elsewhere as
    # `import('./this-file.js').X`). Here the inline `import()` IS the
    # definition; hoisting it to a bare `X` would delete the export and leave
    # the alias pointing at nothing. Only the alias form is excluded: a
    # `@typedef {object} Foo` block whose `@property {import('mod').Y}` carries
    # a use-site is still flagged — the regex requires `import` immediately
    # after `@typedef {`, which the object form never has.
    - not:
        regex: '@typedef\s*\{\s*import\('
    # EXCLUDE a type-predicate position `x is import('mod').T` (e.g.
    # `@returns {v is import('mod').T}`, `@type {(v: unknown) => v is
    # import('mod').T}`). The hoisted `@import` form does NOT resolve in
    # predicate position on the TS/JSDoc toolchain — the bare `T` reads as
    # `undefined` there even with a correct top-level `@import` — so the inline
    # import must stay. Flagging it would drive an agent toward a fix that
    # breaks the type-guard.
    - not:
        regex: '\bis\s+import\('