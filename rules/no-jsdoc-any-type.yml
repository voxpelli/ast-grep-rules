id: no-jsdoc-any-type
language: javascript
# Diagnostic split across ast-grep's fields (see no-jsdoc-object-typedef for the
# convention): `message` = one line WHAT; `note` = the decision tree; `metadata`
# = machine-readable routing. This is the JUDGMENT rule — it deliberately
# over-fires on legitimate `any`, so the note NAMES those exceptions rather
# than pretending every hit is a bug.
# NOTE: `$TAG` interpolation was lost when ast-grep 0.45.0 broke `pattern: $C`
# binding for comment nodes. Revert to the `transform`-based version if/when
# ast-grep restores comment metavariable binding.
message: >-
  `any` in a JSDoc tag defeats type-checking here (prefer `unknown`). Not every
  `any` should change — see the note's decision tree first.
note: |
  Decision tree — pick the FIRST that applies:
  1. You know the concrete type → name it.
  2. It is an untyped boundary value → type it `unknown`, then NARROW before
     use: `@voxpelli/typed-utils` `isObject(x)` / `typesafeIsArray(x)` for the
     object/array boundary, or a `x is T` predicate. The tsc error at each use
     site after this change is EXPECTED — it is your signal to add the narrower,
     NOT to revert to `any`.
  3. It is a DELIBERATE boundary `any` — LEAVE IT. Two legitimate cases:
     - a genuinely untyped 3rd-party API value at the boundary, and
     - a generic top-function constraint `(...args: any[]) => any` (the
       idiomatic "any function" type; `(...args: unknown[]) => unknown` rejects
       typed handlers by contravariance, so `any` is the correct bound there).
  Not auto-fixed: only you know which case applies.
metadata:
  autofixable: false
  edits: context-dependent  # annotation-only for drop-in cases; may add a runtime narrower
  applyMode: judgment       # over-fires on legitimate boundary / top-function any
  cheapModelSafe: false     # 4/9 in-pilot — needs judgment + the tsc gate, not a blind sweep
  gate: tsc --noEmit
severity: warning
# No `fix:` — an automatic `any`→`unknown` swap would leave the now-`unknown`
# value unnarrowed at every use site, trading a silent `any` for a hard tsc
# error the author still has to resolve by hand; better to point them at the
# narrower. (A `not:` regex could suppress the `(...args: any[]) => any`
# top-function case at the AST level, but that hides a teachable exception AND
# risks masking real `any` nearby — the note-based "leave it" guidance in case
# 3 is preferred.)
rule:
  kind: comment
  regex: '@(param|returns|type|property)\s*\{[^}]*\bany\b'
